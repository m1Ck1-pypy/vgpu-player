[workspace]
resolver = "3"
members = [
    "crates/player-core",
    "crates/player-gpui",
    "crates/player-cli",
    "crates/player-app",
]
default-members = ["crates/player-app"]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/m1Ck1-pypy/vgpu-player"
publish = false

[workspace.dependencies]
player-core = { path = "crates/player-core" }
player-gpui = { path = "crates/player-gpui" }

gpui = { package = "gpui-fast", version = "0.1.16" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.16" }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.5.5", features = ["all"] }
ffmpeg = { package = "ffmpeg-next", version = "9.1" }
image = { version = "0.25", default-features = false, features = ["png"] }
crossbeam-channel = "0.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
ureq = { version = "3.5.2", default-features = false, features = [
    "native-tls",
] }
tiny_http = "0.12.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
