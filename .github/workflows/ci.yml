name: ci

on:
  push:
    paths:
      - "crates/**"
      - "assets/**"
      - ".github/**"
  pull_request:
    paths:
      - "crates/**"
      - "assets/**"
      - ".github/**"

# Один прогон на ref: новый коммит отменяет предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Системные библиотеки, которые требует GPUI на Linux (список из CI
      # самого gpui-fast). gtk/webkit не ставим: они нужны только для
      # нативной композиции, которой у нас нет.
      - name: Установить зависимости GPUI для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev \
            clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Набор проверок из RULES.md: ровно то, что гоняется перед коммитом.
      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace
